name: Docker

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Build the images and start the stack
        run: docker compose up -d --build --wait --wait-timeout 600

      - name: Check the API
        run: |
          curl --fail --silent --show-error http://localhost:8000/api/v1/health
          echo
          curl --fail --silent --show-error http://localhost:8000/api/v1/config/status
          echo
          curl --fail --silent --show-error http://localhost:8000/api/v1/jobs | grep --quiet '"total":20'

      - name: Check the website
        run: curl --fail --silent --show-error http://localhost:8080/ | grep --quiet 'id="root"'

      - name: Show the container logs if something failed
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes